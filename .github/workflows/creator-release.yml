name: Creator release validation
on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v ./...
      - run: go test -v ./...
        working-directory: examples/pulse-dock
      - name: Check native OpenGL build and rendering parity
        shell: bash
        run: |
          log="$RUNNER_TEMP/opengl.log"
          status=0
          go test -tags terminalgl -v -run '^TestOpenGL' ./... >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            python - "$log" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          failures = [line for line in lines if any(
              word in line for word in ("FAIL", "panic:", "fatal error:", ".go:", "SKIP")
          )]
          report = "\n".join((failures or lines)[-28:])[-4000:]
          print("::error title=Native OpenGL check failed::" + report.replace("%", "%25").replace("\n", "%0A"))
          PY
            exit "$status"
          fi
      - name: Build race-enabled terminal engine
        if: runner.os != 'Windows'
        shell: bash
        run: go build -race -o "$RUNNER_TEMP/graphics" .
      - name: Run editor and terminal PTY smoke tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for check in check_editor check_terminal; do
            log="$RUNNER_TEMP/$check.log"
            if python3 -u "scripts/$check.py" "$RUNNER_TEMP/graphics" >"$log" 2>&1; then
              cat "$log"
            else
              cat "$log"
              python3 - "$check" "$log" <<'PY'
          import pathlib
          import sys

          check, log = sys.argv[1:]
          lines = pathlib.Path(log).read_text(errors="replace").splitlines()
          summary = "\n".join(
              line if len(line) <= 1200 else line[:600] + " … " + line[-600:]
              for line in lines[-12:]
          )
          print(f"::error title={check} failed::" + summary.replace("%", "%25").replace("\n", "%0A"))
          PY
              exit 1
            fi
          done
