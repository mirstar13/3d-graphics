name: Creator release validation
on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v ./...
      - run: go test -v ./...
        working-directory: examples/pulse-dock
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          go build -race -o "$RUNNER_TEMP/graphics" .
          python3 scripts/check_editor.py "$RUNNER_TEMP/graphics"
          python3 scripts/check_terminal.py "$RUNNER_TEMP/graphics"
