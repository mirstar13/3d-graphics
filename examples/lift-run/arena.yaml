version: 1
name: Lift Run
objective:
  text: Ride the launch pad and reach the elevated landing
  signal: landing
  tick_limit: 900
camera:
  position: {x: 0, y: 6, z: -12}
  target: {x: 0, y: 1.5, z: 0}
  fovx: 65
  fovy: 42
  near: 0.15
  far: 65
entities:
  - id: runner
    name: Runner
    shape: sphere
    body: dynamic
    position: {x: -4, y: 0.4, z: 0}
    size: {x: 0.4, y: 0.4, z: 0.4}
    mass: 1
    linear_damping: 0
    friction: 0
    sphere_ccd: "on"
    color: {r: 255, g: 113, b: 96}
  - id: floor
    name: Runway
    shape: box
    body: static
    position: {x: 0, y: -0.25, z: 0}
    size: {x: 6, y: 0.25, z: 1.5}
    mass: 1
    friction: 0
    color: {r: 66, g: 80, b: 118}
  - id: lift
    name: Launch pad
    shape: box
    body: static
    sensor: true
    plate_signal: lift
    plate_sound: boost
    enter_impulse: {x: 0, y: 9, z: 0}
    position: {x: -0.7, y: 0.1, z: 0}
    size: {x: 0.5, y: 0.15, z: 1.1}
    mass: 1
    color: {r: 44, g: 167, b: 249}
  - id: platform
    name: Landing platform
    shape: box
    body: static
    position: {x: 3.5, y: 2, z: 0}
    size: {x: 1.5, y: 0.2, z: 1}
    mass: 1
    color: {r: 218, g: 157, b: 55}
  - id: landing
    name: Landing sensor
    shape: box
    body: static
    sensor: true
    plate_signal: landing
    position: {x: 3.5, y: 2.35, z: 0}
    size: {x: 1.4, y: 0.16, z: 0.95}
    mass: 1
    color: {r: 242, g: 219, b: 100}
